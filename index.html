    <style>
      #splash { position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(60vmax 60vmax at 110% -10%, rgba(124,92,255,.28), transparent 60%), radial-gradient(50vmax 50vmax at -20% 30%, rgba(34,195,230,.16), transparent 60%), #070a12;
        font-family: 'Heebo', system-ui, sans-serif; direction: rtl; transition: opacity .5s ease; }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .sp-globe { animation: sp-pop .9s cubic-bezier(.2,.8,.2,1) both; filter: drop-shadow(0 10px 30px rgba(43,140,240,.35)); }
      #splash .title { font-size: 36px; font-weight: 900; margin-top: 14px; display: flex; }
      #splash .title span { display: inline-block; white-space: pre; background: linear-gradient(135deg,#a48bff,#5b8cff 55%,#22c3e6); -webkit-background-clip: text; background-clip: text; color: transparent;
        opacity: 0; animation: sp-letter .6s cubic-bezier(.2,.8,.2,1) forwards; }
      #splash .year { font-size: 18px; font-weight: 800; color: #c7d4ff; opacity: 0; animation: sp-year .9s 1.2s cubic-bezier(.2,.8,.2,1) forwards; }
      #splash .loader { margin-top: 34px; display: flex; flex-direction: column; align-items: center; opacity: 0; animation: sp-fade .5s 1.55s ease forwards; }
      #splash .bar { width: 200px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; direction: ltr; }
      #splash .fill { height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg,#7c5cff,#5b8cff,#22c3e6); box-shadow: 0 0 12px rgba(91,140,255,.7); }
      #splash .pct { font-size: 12px; color: #8b95ab; margin-top: 7px; font-variant-numeric: tabular-nums; direction: ltr; }
      @keyframes sp-pop { from { opacity: 0; transform: scale(.7) rotate(-8deg); } to { opacity: 1; transform: none; } }
      @keyframes sp-letter { from { opacity: 0; transform: translateY(16px) scale(.9); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
      @keyframes sp-year { from { opacity: 0; letter-spacing: 22px; } to { opacity: .9; letter-spacing: 7px; } }
      @keyframes sp-fade { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #splash * { animation-duration: .01s !important; animation-delay: 0s !important; } }
    </style>

    <script>
      // Loading screen: globe → title → year → progress bar that always runs all the way to 100%.
      (function () {
        var s = document.getElementById("splash"), fill = document.getElementById("splash-fill"), pct = document.getElementById("splash-pct");
        var start = Date.now(), BAR_AT = 1600, BAR_TIME = 1100, ready = false, p = 0, closing = false;
        function draw() { fill.style.width = p.toFixed(1) + "%"; pct.textContent = Math.round(p) + "%"; }
        var iv = setInterval(function () {
          var t = Date.now() - start - BAR_AT;
          if (t < 0) return;
          var goal = Math.min(100, (t / BAR_TIME) * 100), cap = ready ? 100 : 90;
          p += (Math.min(goal, cap) - p) * 0.22;
          if (ready && goal >= 100 && p > 99.5) p = 100;
          draw();
          if (p === 100 && !closing) {
            closing = true; clearInterval(iv);
            setTimeout(function () { s.classList.add("hide"); setTimeout(function () { s.remove(); }, 550); }, 350);
          }
        }, 40);
        window.__appReady = function () { ready = true; };
        setTimeout(function () { ready = true; }, 12000); // never get stuck
      })();
    </script>
